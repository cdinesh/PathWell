services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thrive
      POSTGRES_PASSWORD: thrive
      POSTGRES_DB: thrive
    ports: ["5432:5432"]
    volumes: [thrive_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thrive"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  thrive_data:
